<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeHub Insurance Agency Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #C4A747;
            --dark: #1a1a1a;
            --white: #FFFFFF;
            --light-gray: #F5F5F5;
            --gray: #808080;
            --text: #1E293B;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --border: #E5E5E5;
            --border-color: #E5E5E5;
            --bg-light: #F5F9F8;
            --bg-card: #FFFFFF;
            --bg-body: #F5F9F8;
            --bg-secondary: #F0F4F8;
            --bg-hover: #F0F4F8;
            --accent: #27A570;
            --primary: #1a73e8;
            --primary-dark: #1558b0;
            --success: #22c55e;
            --alert: #ef4444;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        [data-theme="dark"] {
            --text: #E2E8F0;
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --border: #374151;
            --border-color: #374151;
            --bg-light: #111827;
            --bg-secondary: #1a2130;
            --bg-card: #1F2937;
            --bg-body: #111827;
            --bg-hover: #2D3748;
            --primary: #4a9eff;
            --primary-dark: #2b7de9;
            --success: #4ade80;
            --alert: #f87171;
            --warning: #fbbf24;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-body);
            color: var(--text);
            transition: background 0.2s, color 0.2s;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 240px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
        }

        .sidebar-branding h1 {
            font-size: 14px;
            font-weight: 700;
            margin: 0;
        }

        .sidebar-branding p {
            font-size: 11px;
            color: var(--text-secondary);
            margin: 0;
        }

        .role-switcher {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
        }

        .role-switcher label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .role-switcher select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-light);
            color: var(--text);
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 0;
            overflow-y: auto;
        }

        .nav-section {
            margin-bottom: 20px;
        }

        .nav-section-title {
            padding: 0 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: block;
        }

        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--bg-hover);
        }

        .nav-item.active {
            background: var(--bg-secondary);
            border-left-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item i {
            width: 16px;
            text-align: center;
            font-size: 14px;
        }

        .nav-item .badge {
            margin-left: auto;
            background: var(--alert);
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 700;
        }

        /* ===== MAIN AREA ===== */
        .main-area {
            flex: 1;
            margin-left: 240px;
            display: flex;
            flex-direction: column;
        }

        /* ===== TOPBAR ===== */
        .topbar {
            height: 60px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            gap: 20px;
        }

        .topbar-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text);
            font-size: 16px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification-icon {
            position: relative;
            cursor: pointer;
            color: var(--text);
            font-size: 16px;
        }

        .notification-icon .badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background: var(--alert);
            color: white;
            border-radius: 10px;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }

        /* ===== CONTENT ===== */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .screens-container {
            width: 100%;
            height: 100%;
        }

        .screen {
            display: none;
            width: 100%;
            min-height: 100%;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin: 0;
        }

        /* ===== BUTTONS ===== */
        .btn {
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
        }

        .btn-success {
            background: var(--accent);
            color: white;
        }

        .btn-success:hover {
            background: #1d8a59;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* ===== TABLES ===== */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--bg-secondary);
        }

        th {
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
            text-align: left;
        }

        td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        tbody tr {
            transition: background 0.2s;
            cursor: pointer;
        }

        tbody tr:hover {
            background: var(--bg-hover);
        }

        /* ===== BADGES ===== */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-gifted {
            background: #dbeafe;
            color: #1e40af;
        }

        [data-theme="dark"] .badge-gifted {
            background: #1e3a8a;
            color: #93c5fd;
        }

        .badge-success {
            background: #dcfce7;
            color: #166534;
        }

        [data-theme="dark"] .badge-success {
            background: #064e3b;
            color: #86efac;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        [data-theme="dark"] .badge-warning {
            background: #78350f;
            color: #fcd34d;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        [data-theme="dark"] .badge-danger {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .badge-primary {
            background: #dbeafe;
            color: #1e40af;
        }

        [data-theme="dark"] .badge-primary {
            background: #1e3a8a;
            color: #93c5fd;
        }

        /* ===== KPI GRID ===== */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .kpi-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
        }

        .kpi-subtext {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* ===== QUICK ACTIONS ===== */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .quick-action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            color: var(--text);
        }

        .quick-action-btn:hover {
            background: var(--bg-hover);
            border-color: var(--primary);
        }

        .quick-action-btn i {
            font-size: 24px;
            color: var(--primary);
        }

        .quick-action-btn span {
            font-size: 12px;
            font-weight: 600;
        }

        /* ===== ACTIVITY FEED ===== */
        .activity-feed {
            margin-top: 20px;
        }

        .activity-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            width: 36px;
            height: 36px;
            background: var(--bg-secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--primary);
            font-size: 14px;
        }

        .activity-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .activity-text {
            font-size: 13px;
            color: var(--text);
        }

        .activity-date {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* ===== FORMS ===== */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        input[type="text"],
        input[type="email"],
        input[type="phone"],
        input[type="tel"],
        select,
        textarea {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text);
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* ===== FILTERS ===== */
        .filter-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-input {
            flex: 1;
            min-width: 250px;
        }

        .filter-input input {
            width: 100%;
        }

        .filter-select {
            min-width: 150px;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }

        .filter-tab {
            padding: 10px 0;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: -2px;
        }

        .filter-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* ===== PAGINATION ===== */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            font-size: 13px;
        }

        .pagination select {
            padding: 6px 10px;
            font-size: 12px;
        }

        .pagination-button {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-card);
            cursor: pointer;
            color: var(--text);
            font-size: 13px;
        }

        .pagination-button:hover {
            background: var(--bg-hover);
        }

        /* ===== MODALS ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 20px;
            padding: 0;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* ===== TOASTS ===== */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 15px 20px;
            min-width: 300px;
            font-size: 13px;
            animation: slideInRight 0.2s ease-out;
        }

        .toast.success {
            border-left-color: var(--success);
        }

        .toast.warning {
            border-left-color: var(--warning);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== UTILITIES ===== */
        .text-muted {
            color: var(--text-secondary);
        }

        .text-bold {
            font-weight: 600;
        }

        .gap-2 {
            gap: 20px;
        }

        .mt-20 {
            margin-top: 20px;
        }

        .mb-20 {
            margin-bottom: 20px;
        }

        .unread-banner {
            background: #dbeafe;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1e40af;
            font-size: 13px;
        }

        [data-theme="dark"] .unread-banner {
            background: #1e3a8a;
            border-color: #1e40af;
            color: #93c5fd;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s;
        }

        .stat-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* ===== LAYOUT UTILITIES ===== */
        .flex-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .column-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 1200px) {
            .column-2 {
                grid-template-columns: 1fr;
            }

            .kpi-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">HH</div>
                <div class="sidebar-branding">
                    <h1>HomeHub</h1>
                    <p>Insurance Portal</p>
                </div>
            </div>

            <div class="role-switcher">
                <label for="roleSelect">Active Role</label>
                <select id="roleSelect">
                    <option value="single-agent">Single Agent</option>
                    <option value="agency-admin">Agency Admin</option>
                </select>
            </div>

            <nav class="sidebar-nav" id="sidebarNav"></nav>
        </aside>

        <!-- MAIN AREA -->
        <div class="main-area">
            <!-- TOPBAR -->
            <header class="topbar">
                <h2 class="topbar-title" id="pageTitle">Dashboard</h2>
                <div class="topbar-actions">
                    <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">
                        <i class="fas fa-moon"></i>
                    </button>
                    <div class="notification-icon" id="notificationBell">
                        <i class="fas fa-bell"></i>
                        <span class="badge" id="notificationBadge" style="display: none;">0</span>
                    </div>
                    <div class="user-avatar" title="User Profile">JC</div>
                </div>
            </header>

            <!-- CONTENT -->
            <div class="content">
                <div class="screens-container" id="screensContainer"></div>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div class="modal-overlay" id="homeownerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Homeowner Details</h3>
                <button class="modal-close" onclick="closeModal('homeownerModal')">&times;</button>

        function renderHomeownersTable() {
            const search = document.getElementById('homeownerSearch')?.value || '';
            const agentFilter = document.getElementById('agentFilter')?.value || '';
            const giftedFilter = document.getElementById('giftedFilter')?.value || '';

            let filtered = HOMEOWNERS.filter(h => {
                const matchSearch = h.name.toLowerCase().includes(search.toLowerCase()) ||
                                  h.address.toLowerCase().includes(search.toLowerCase());
                const matchAgent = !agentFilter || h.agentId === agentFilter;
                const matchGifted = !giftedFilter || (giftedFilter === 'gifted' ? h.gifted : !h.gifted);
                return matchSearch && matchAgent && matchGifted;
            });

            const pageSize = currentPageSize || filtered.length;
            const start = (currentPage - 1) * pageSize;
            const paginated = filtered.slice(start, start + pageSize);
            const totalPages = Math.ceil(filtered.length / pageSize) || 1;

            const tbody = document.getElementById('homeownersTableBody');
            tbody.innerHTML = paginated.map(h => `
                <tr onclick="showHomeownerDetail('${h.id}')">

        function renderMessageList() {
            const filtered = MESSAGES.filter(m => m.type === currentMessageTab);
            const list = document.getElementById('messageList');
            list.innerHTML = filtered.map(m => `
                <div onclick="showMessagePreview('${m.id}')" style="padding: 15px; border-bottom: 1px solid var(--border); cursor: pointer; background: ${!m.read ? 'var(--bg-secondary)' : 'transparent'}; transition: background 0.2s;">

                        <div style="width: 8px; height: 8px; border-radius: 50%; background: ${!m.read ? 'var(--primary)' : 'transparent'}; margin-top: 5px; flex-shrink: 0;"></div>
                        <div style="flex: 1; min-width: 0;">
                            <div style="font-weight: 600; font-size: 12px; color: var(--text);">${m.from}</div>
                            <div style="font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${m.subject}</div>
                        </div>
                    </div>
                </div>
            `).join('');

        function showMessagePreview(id) {
            const msg = MESSAGES.find(m => m.id === id);
            if (!msg) return;

            msg.read = true;
            updateNotificationBadge();
            renderSidebarNav();

            const preview = document.getElementById('messagePreview');
            preview.innerHTML = `
                <div>
                    <h3 style="margin-bottom: 5px;">${msg.subject}</h3>
                    <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 15px;">
                        From: <strong>${msg.from}</strong> | ${msg.date}
                    </div>
                </div>
                <div style="background: var(--bg-secondary); padding: 15px; border-radius: 8px; line-height: 1.6;">
                    ${msg.body}
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" onclick="openModal('composeModal')">
                        <i class="fas fa-reply"></i> Reply
                    </button>
                    <button class="btn btn-secondary" onclick="deleteMessage('${id}')">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            `;
        }

        function deleteMessage(id) {
            MESSAGES = MESSAGES.filter(m => m.id !== id);
            updateNotificationBadge();
            document.getElementById('messagePreview').innerHTML = '<p style="color: var(--text-secondary);">Select a message to view</p>';
            toast('Message deleted', 'info');
            renderMessageList();
        }

        function submitMessage() {
            const to = document.getElementById('composeTo').value;
            const subject = document.getElementById('composeSubject').value;
            const body = document.getElementById('composeBody').value;

            if (!to || !subject || !body) {
                toast('Please fill in all fields', 'warning');
                return;
            }

            const newMsg = {
                id: 'MSG' + (MESSAGES.length + 1).toString().padStart(3, '0'),
                from: 'Agency',
                to: to,
                subject,
                body,
                date: new Date().toISOString().split('T')[0],
                read: true,
                type: 'sent'
            };

            MESSAGES.push(newMsg);
            closeModal('composeModal');
            document.getElementById('composeTo').value = '';
            document.getElementById('composeSubject').value = '';
            document.getElementById('composeBody').value = '';
            toast('Message sent successfully', 'success');
        }

        // ===== INITIALIZATION =====
        function init() {
            // Set up role switcher
            document.getElementById('roleSelect').addEventListener('change', (e) => {
                currentRole = e.target.value;
                currentPage = 1;
                goToScreen('dashboard');
                renderAllScreens();
                renderSidebarNav();
                updateNotificationBadge();
            });

            // Set up theme toggle
            document.getElementById('themeToggle').addEventListener('click', () => {
                const html = document.documentElement;
                const isDark = html.getAttribute('data-theme') === 'dark';
                html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            });

            // Close modals when clicking overlay
            document.querySelectorAll('.modal-overlay').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.classList.remove('active');
                    }
                });
            });

            // Populate doc homeowner dropdown
            const docSelect = document.getElementById('docHomeownerSelect');
            if (docSelect) {
                HOMEOWNERS.forEach(h => {
                    const option = document.createElement('option');
                    option.value = h.id;
                    option.textContent = h.name;
                    docSelect.appendChild(option);
                });
            }

            // Initial render
            renderAllScreens();
            renderSidebarNav();
            updateNotificationBadge();
            renderHomeownersTable();
            renderDocsTable();
            renderMessageList();
            renderAgentsTable();
        }

        // Start app
        init();
    </script>
